name: Sync Backup

# Fires whenever code is pushed to main — including pushes from
# scripts/sync-to-github.sh running inside Replit.
on:
  push:
    branches:
      - main

jobs:
  tag-backup:
    name: Create timestamped backup tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create backup tag
        run: |
          TIMESTAMP="$(date -u '+%Y%m%dT%H%M%SZ')"
          TAG="backup/${TIMESTAMP}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Created backup tag: $TAG"
