    <script>
      // Restore path encoded by 404.html for GitHub Pages SPA routing
      (function() {
        var search = location.search;
        if (search && search.indexOf('?/') === 0) {
          var decoded = search.slice(2).replace(/~and~/g, '&');
          // Split path from query params (&first=val → ?first=val)
          var ampIdx = decoded.indexOf('&');
          var pathPart = ampIdx === -1 ? decoded : decoded.slice(0, ampIdx);
          var queryPart = ampIdx === -1 ? '' : '?' + decoded.slice(ampIdx + 1);
          // Ensure exactly one slash between base and restored path
          var base = location.pathname.replace(/\/$/, '');
          history.replaceState(null, null, base + '/' + pathPart + queryPart + location.hash);
        }
      })();
    </script>
