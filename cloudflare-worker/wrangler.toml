name = "clearpath-form"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Set TO_EMAIL and FROM_EMAIL here — or override per environment below
TO_EMAIL = "you@yourdomain.com"
FROM_EMAIL = "noreply@yourdomain.com"

# Optional: restrict CORS to your production domain
# ALLOWED_ORIGIN = "https://clearpathauto.pages.dev"

# Secrets (set via CLI — never put keys in this file):
#   wrangler secret put RESEND_API_KEY
