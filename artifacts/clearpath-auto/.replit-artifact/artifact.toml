kind = "web"
previewPath = "/"
title = "ClearPath Auto"
version = "1.0.0"
id = "artifacts/clearpath-auto"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18431

[services.development]
run = "pnpm --filter @workspace/clearpath-auto run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/clearpath-auto", "run", "build" ]
publicDir = "artifacts/clearpath-auto/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18431"
BASE_PATH = "/"
